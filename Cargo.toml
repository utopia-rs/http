[package]
name = "utopia-http"
description = "An HTTP framework on hyper: routes, hooks, parameters with validators, requests and responses."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"

[dependencies]
brotli = { version = "8", default-features = false, features = ["std"] }
bytes = "1"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
indexmap = "2"
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tracing = "0.1"
utopia-system = { version = "0.1.0", git = "https://github.com/utopia-rs/system" }
utopia-validators = { version = "0.1.0", git = "https://github.com/utopia-rs/validators" }
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "rt", "io-util"] }

[package.metadata.utopia]
php-sync = "18a66249caf061b011d9eb3c97afbdba668be4c1"